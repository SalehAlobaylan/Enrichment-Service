[project]
name = "enrichment-service"
version = "1.0.0"
description = "AI/ML enrichment microservice for the Wahb platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "faster-whisper>=1.0.0",
    "sentence-transformers>=3.0.0",
    "scrapling>=0.2.9",
    "playwright>=1.48.0",
    "openai>=1.50.0",
    "anthropic>=0.37.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "coverage>=7.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that load real ML models",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
