[project]
name = "enrichment-service"
version = "1.0.0"
description = "AI/ML enrichment microservice for the Wahb platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "httpx==0.28.1",
    "structlog==25.5.0",
    "torch==2.11.0",
    "sentence-transformers==5.3.0",
    "transformers==4.57.6",
    "FlagEmbedding==1.4.0",
    "scrapling==0.4.2",
    "curl_cffi==0.15.0",
    "browserforge==1.2.4",
    "lxml==6.0.2",
    "openai==2.29.0",
    "anthropic==0.86.0",
    "google-genai==2.3.0",
    "prometheus-fastapi-instrumentator==7.1.0",
    "python-multipart==0.0.22",
    "redis==5.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "respx==0.22.0",
    "coverage==7.13.5",
    "ruff==0.15.7",
    "pyright==1.1.411",
]

# `pyproject.toml` plus the checked-in `uv.lock` is the sole dependency
# authority. Requirements exports are deliberately untracked compatibility
# artifacts. Pin torch to the CPU index so lock resolution cannot pull
# CUDA wheels into a Cranl build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that load real ML models",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pyright]
include = [
    "src/common/clients/cms.py",
    "src/common/spaceid.py",
    "src/llm/clients/llm.py",
    "src/llm/clients/spend_meter.py",
]
typeCheckingMode = "basic"
reportMissingImports = "none"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
