services:
  enrichment:
    build: .
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
    env_file:
      - .env
    environment:
      - ENV=development
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    mem_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
