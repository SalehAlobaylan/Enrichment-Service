name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Check locked dependency graph
        run: make dependency-check
      - name: Install locked dev environment
        run: make install-dev
      - name: Lint
        run: make lint
      - name: Scoped type check
        run: make typecheck
      - name: Full test suite
        run: make test
